[project]
name = "cctv-dj-jbh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lap>=0.5.12",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "pyside6>=6.6",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
